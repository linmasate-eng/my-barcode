<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>7系条码助手（萌趣卡通版）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <style>
        /* 动画卡通风专属配色与粗边框变量 */
        :root { 
            --bg-color: #fffdf9;
            --primary: #ff6b6b; /* 活力红粉 */
            --secondary: #4ecdc4; /* 薄荷绿 */
            --accent: #ffe66d; /* 柠檬黄 */
            --dark: #2d3436;
            --border: 3px solid #2d3436;
            --shadow: 4px 4px 0px #2d3436;
            --shadow-sm: 2px 2px 0px #2d3436;
        }

        body { 
            font-family: "Comic Sans MS", "Chalkboard SE", -apple-system, sans-serif; 
            background: var(--bg-color); 
            background-image: radial-gradient(#dfe6e9 15%, transparent 16%), radial-gradient(#dfe6e9 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            padding: 15px 15px 150px 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            color: var(--dark);
        }
        
        .version-tag { 
            background: var(--accent); 
            color: var(--dark); 
            padding: 6px 16px; 
            border-radius: 20px; 
            font-size: 13px; 
            margin-bottom: 15px; 
            font-weight: 900; 
            border: var(--border);
            box-shadow: var(--shadow-sm);
            transform: rotate(-1deg);
        }

        /* 标签页切换 */
        .tab-container { display: flex; width: 100%; max-width: 400px; margin-bottom: 20px; gap: 10px; }
        .tab-btn { 
            flex: 1; 
            padding: 12px; 
            border: var(--border); 
            border-radius: 16px; 
            font-size: 15px; 
            font-weight: 900; 
            cursor: pointer; 
            background: white; 
            color: var(--dark); 
            box-shadow: var(--shadow);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .tab-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #2d3436; }
        .tab-active-weight { background: var(--primary); color: white; }
        .tab-active-price { background: var(--secondary); color: var(--dark); }

        /* 卡片容器：厚边框加硬阴影，漫画立体感 */
        .card { 
            background: white; 
            padding: 22px; 
            border-radius: 20px; 
            border: var(--border);
            box-shadow: var(--shadow);
            width: 100%; 
            max-width: 400px; 
            box-sizing: border-box; 
        }

        .input-group { margin-bottom: 14px; text-align: left; }
        label { font-size: 13px; font-weight: 900; color: var(--dark); display: block; margin-bottom: 5px; }
        
        input { 
            width: 100%; 
            padding: 12px; 
            border: var(--border); 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 16px; 
            outline: none; 
            background: #fff;
            font-weight: bold;
            box-shadow: inset 2px 2px 0px rgba(0,0,0,0.05);
        }
        input:focus { background: #fffaf0; }
        
        .highlight-fill { background-color: #fff9db !important; border-color: var(--primary) !important; }

        /* 卡通风格大按钮 */
        button.btn-weight { 
            width: 100%; padding: 14px; background: var(--primary); color: white; 
            border: var(--border); border-radius: 14px; font-size: 16px; font-weight: 900; 
            cursor: pointer; margin-top: 5px; box-shadow: var(--shadow);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        button.btn-weight:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #2d3436; }

        button.btn-price { 
            width: 100%; padding: 14px; background: var(--secondary); color: var(--dark); 
            border: var(--border); border-radius: 14px; font-size: 16px; font-weight: 900; 
            cursor: pointer; margin-top: 5px; box-shadow: var(--shadow);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        button.btn-price:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #2d3436; }
        
        .history-list { width: 100%; max-width: 400px; margin-top: 25px; }
        
        /* 结果条码卡片 */
        .item { 
            background: white; 
            padding: 22px; 
            border-radius: 20px; 
            margin-bottom: 30px; 
            position: relative; 
            border: var(--border);
            box-shadow: var(--shadow);
            text-align: center; 
        }
        
        .item-info { text-align: center; border-bottom: 2px dashed #dfe6e9; margin-bottom: 12px; padding-bottom: 12px; }
        .item-note { font-weight: 900; color: var(--dark); font-size: 20px; }
        .item-sub { font-size: 14px; color: #636e72; margin-top: 6px; font-weight: bold; }
        .item-code { font-family: monospace; color: var(--dark); font-size: 20px; font-weight: 900; margin-top: 10px; display: block; letter-spacing: 2px; } 

        /* 折扣行 */
        .discount-box { 
            display: flex; align-items: center; justify-content: center; gap: 8px; 
            margin-bottom: 12px; font-size: 14px; font-weight: bold; color: var(--dark); 
            background: #f1f2f6; padding: 8px; border-radius: 12px; border: 2px solid var(--dark); 
        }
        .discount-box input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary); }
        .discount-box input[type="number"] { width: 60px; padding: 4px; text-align: center; font-size: 14px; border: 2px solid var(--dark); border-radius: 8px; box-shadow: none; }

        /* 卡通红叉删除按钮 */
        .btn-del { 
            position: absolute; right: 12px; top: 12px; color: white; border: var(--border); 
            background: #ff7675; border-radius: 50%; width: 32px; height: 32px; font-size: 18px; 
            font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; 
            box-shadow: var(--shadow-sm);
            transition: transform 0.1s;
        }
        .btn-del:active { transform: scale(0.9); }

        canvas { width: 100% !important; height: auto; margin-top: 10px; background: white; border-radius: 8px; }
        
        #section-weight { display: flex; flex-direction: column; align-items: center; width: 100%; }
        #section-price { display: none; flex-direction: column; align-items: center; width: 100%; }
    </style>
</head>
<body>

    <div class="version-tag">🎨 萌趣卡通防误差版 v2.3</div>

    <div class="tab-container">
        <button id="tab-weight" class="tab-btn tab-active-weight" onclick="switchTab('weight')">⚖️ 按重量生成</button>
        <button id="tab-price" class="tab-btn" onclick="switchTab('price')">💰 按价格反推</button>
    </div>

    <div id="section-weight">
        <div class="card">
            <h2 style="margin:0 0 15px 0; color:var(--primary); font-size:20px; text-align: center; font-weight:900;">✨ 录入重量生成条码 ✨</h2>
            <div class="input-group">
                <label>货号</label>
                <input type="tel" id="w-sku" placeholder="如: 16">
            </div>
            <div class="input-group">
                <label>重量 (kg)</label>
                <input type="number" id="w-weight" step="0.001" placeholder="如: 0.525">
            </div>
            <div class="input-group">
                <label>备注</label>
                <input type="text" id="w-note" placeholder="如: 青瓜">
            </div>
            <button class="btn-weight" onclick="saveWeightCode()">🚀 生成并保存</button>
        </div>
        <div id="list-weight" class="history-list"></div>
    </div>

    <div id="section-price">
        <div class="card">
            <h2 style="margin:0 0 15px 0; color:#00b894; font-size:20px; text-align: center; font-weight:900;">🎯 输入价格反推重量 🎯</h2>
            <div class="input-group">
                <label>货号 (自动填单价)</label>
                <input type="tel" id="p-sku" placeholder="输入货号">
            </div>
            <div style="display:flex; gap:10px;">
                <div class="input-group" style="flex:1;">
                    <label>单价 (元/kg)</label>
                    <input type="number" id="p-unit" step="0.01" placeholder="单价">
                </div>
                <div class="input-group" style="flex:1;">
                    <label>总价 (元)</label>
                    <input type="number" id="p-total" step="0.01" placeholder="总额">
                </div>
            </div>
            <div class="input-group">
                <label>备注</label>
                <input type="text" id="p-note" placeholder="备注">
            </div>
            <button class="btn-price" onclick="savePriceCode()">✨ 换算并生成</button>
        </div>
        <div id="list-price" class="history-list"></div>
    </div>

    <script>
        const cardColors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff9f43', '#54a0ff', '#5f27cd'];

        function getRandomColor() {
            return cardColors[Math.floor(Math.random() * cardColors.length)];
        }

        window.onload = function() {
            renderWeightList();
            renderPriceList();
            
            document.getElementById('p-sku').addEventListener('input', function() {
                let sku = this.value.padStart(6, '0');
                let map = JSON.parse(localStorage.getItem('sku_price_map_v3') || '{}');
                let unitInput = document.getElementById('p-unit');
                if (map[sku]) {
                    unitInput.value = map[sku];
                    unitInput.classList.add('highlight-fill');
                    setTimeout(() => unitInput.classList.remove('highlight-fill'), 500);
                }
            });
        };

        function switchTab(mode) {
            const sw = document.getElementById('section-weight');
            const sp = document.getElementById('section-price');
            const tw = document.getElementById('tab-weight');
            const tp = document.getElementById('tab-price');
            if (mode === 'weight') {
                sw.style.display = 'flex'; sp.style.display = 'none';
                tw.className = 'tab-btn tab-active-weight'; tp.className = 'tab-btn';
            } else {
                sw.style.display = 'none'; sp.style.display = 'flex';
                tw.className = 'tab-btn'; tp.className = 'tab-btn tab-active-price';
            }
        }

        function calculateEAN13(first12) {
            let sO = 0, sE = 0;
            for (let i = 0; i < 12; i++) {
                let n = parseInt(first12[i]);
                if ((i + 1) % 2 === 0) sE += n; else sO += n;
            }
            let ck = (10 - ((sO + sE * 3) % 10)) % 10;
            return first12 + ck;
        }

        // 防折扣误差精准计算核心
        function getComputedGrams(item, currentDiscount, isEnabled) {
            let baseGrams = item.baseGrams;
            if (isEnabled && currentDiscount > 0 && currentDiscount <= 10) {
                let scaledGrams = (baseGrams * 10) / currentDiscount;
                return Math.round(scaledGrams);
            }
            return baseGrams;
        }

        function saveWeightCode() {
            let s = document.getElementById('w-sku').value;
            let w = parseFloat(document.getElementById('w-weight').value);
            let n = document.getElementById('w-note').value || "未命名";
            if (!s || isNaN(w)) return alert("请输入货号和重量");
            
            let baseGrams = Math.round(w * 1000);

            let h = JSON.parse(localStorage.getItem('l_w_v3') || '[]');
            h.unshift({
                id: Date.now(),
                sku: s.padStart(6, '0'),
                baseGrams: baseGrams,
                originalWeightStr: w,
                note: n,
                color: getRandomColor(),
                discountEnabled: false,
                discountVal: 5.0
            });
            localStorage.setItem('l_w_v3', JSON.stringify(h));
            document.getElementById('w-weight').value = "";
            renderWeightList();
        }

        function renderWeightList() {
            let h = JSON.parse(localStorage.getItem('l_w_v3') || '[]');
            let l = document.getElementById('list-weight');
            l.innerHTML = h.map(i => {
                let curGrams = getComputedGrams(i, i.discountVal, i.discountEnabled);
                let displayWeightKg = (curGrams / 1000).toFixed(3);
                let code = calculateEAN13("7" + i.sku + curGrams.toString().padStart(5, '0'));
                
                return `
                <div class="item">
                    <button class="btn-del" onclick="del('l_w_v3',${i.id},'w')">×</button>
                    <div class="discount-box">
                        <label style="margin:0; cursor:pointer;"><input type="checkbox" ${i.discountEnabled ? 'checked' : ''} onchange="toggleDiscount('l_w_v3', ${i.id}, this.checked)"> 开启折扣</label>
                        <span>折扣:</span>
                        <input type="number" step="0.1" min="1" max="9.9" value="${i.discountVal}" onchange="updateDiscountVal('l_w_v3', ${i.id}, this.value)">折
                    </div>
                    <div class="item-info">
                        <div class="item-note">🏷️ ${i.note}</div>
                        <div class="item-sub">原始重量: ${i.originalWeightStr} kg ${i.discountEnabled ? `<br>✨ 折后计费重量: <b>${displayWeightKg} kg</b>` : ''}</div>
                        <span class="item-code">${code}</span>
                    </div>
                    <canvas id="cw-${i.id}"></canvas>
                </div>`;
            }).join('');
            
            h.forEach(i => {
                try {
                    let curGrams = getComputedGrams(i, i.discountVal, i.discountEnabled);
                    let code = calculateEAN13("7" + i.sku + curGrams.toString().padStart(5, '0'));
                    JsBarcode(`#cw-${i.id}`, code, {format:"EAN13", width:2.5, height:70, displayValue:false});
                } catch(e) { console.error(e); }
            });
        }

        function savePriceCode() {
            let s = document.getElementById('p-sku').value;
            let u = parseFloat(document.getElementById('p-unit').value);
            let t = parseFloat(document.getElementById('p-total').value);
            let n = document.getElementById('p-note').value || "未命名";
            if (!s || isNaN(u) || isNaN(t)) return alert("请完整输入");
            
            let baseGrams = Math.round((t / u) * 1000);
            if (baseGrams > 99999) return alert("重量超出限制");
            
            let sku = s.padStart(6, '0');
            let map = JSON.parse(localStorage.getItem('sku_price_map_v3') || '{}');
            map[sku] = u;
            localStorage.setItem('sku_price_map_v3', JSON.stringify(map));

            let h = JSON.parse(localStorage.getItem('l_p_v3') || '[]');
            h.unshift({
                id: Date.now(),
                sku: sku,
                baseGrams: baseGrams,
                totalPrice: t,
                unitPrice: u,
                note: n,
                color: getRandomColor(),
                discountEnabled: false,
                discountVal: 5.0
            });
            localStorage.setItem('l_p_v3', JSON.stringify(h));
            document.getElementById('p-total').value = "";
            renderPriceList();
        }

        function renderPriceList() {
            let h = JSON.parse(localStorage.getItem('l_p_v3') || '[]');
            let l = document.getElementById('list-price');
            l.innerHTML = h.map(i => {
                let curGrams = getComputedGrams(i, i.discountVal, i.discountEnabled);
                let displayWeightKg = (curGrams / 1000).toFixed(3);
                let code = calculateEAN13("7" + i.sku + curGrams.toString().padStart(5, '0'));
                
                return `
                <div class="item">
                    <button class="btn-del" onclick="del('l_p_v3',${i.id},'p')">×</button>
                    <div class="discount-box">
                        <label style="margin:0; cursor:pointer;"><input type="checkbox" ${i.discountEnabled ? 'checked' : ''} onchange="toggleDiscount('l_p_v3', ${i.id}, this.checked)"> 开启折扣</label>
                        <span>折扣:</span>
                        <input type="number" step="0.1" min="1" max="9.9" value="${i.discountVal}" onchange="updateDiscountVal('l_p_v3', ${i.id}, this.value)">折
                    </div>
                    <div class="item-info">
                        <div class="item-note">🏷️ ${i.note}</div>
                        <div class="item-sub">目标总价: ${i.totalPrice}元 ${i.discountEnabled ? `<br>✨ 折后结算重量: <b>${displayWeightKg}kg</b>` : `(约 ${(i.baseGrams/1000).toFixed(3)}kg)`}</div>
                        <span class="item-code">${code}</span>
                    </div>
                    <canvas id="cp-${i.id}"></canvas>
                </div>`;
            }).join('');
            
            h.forEach(i => {
                try {
                    let curGrams = getComputedGrams(i, i.discountVal, i.discountEnabled);
                    let code = calculateEAN13("7" + i.sku + curGrams.toString().padStart(5, '0'));
                    JsBarcode(`#cp-${i.id}`, code, {format:"EAN13", width:2.5, height:70, displayValue:false});
                } catch(e) { console.error(e); }
            });
        }

        function toggleDiscount(key, id, isChecked) {
            let h = JSON.parse(localStorage.getItem(key) || '[]');
            let item = h.find(x => x.id === id);
            if (item) {
                item.discountEnabled = isChecked;
                localStorage.setItem(key, JSON.stringify(h));
                key === 'l_w_v3' ? renderWeightList() : renderPriceList();
            }
        }

        function updateDiscountVal(key, id, val) {
            let num = parseFloat(val);
            if (isNaN(num) || num <= 0 || num >= 10) return;
            let h = JSON.parse(localStorage.getItem(key) || '[]');
            let item = h.find(x => x.id === id);
            if (item) {
                item.discountVal = num;
                localStorage.setItem(key, JSON.stringify(h));
                key === 'l_w_v3' ? renderWeightList() : renderPriceList();
            }
        }

        function del(key, id, type) {
            let h = JSON.parse(localStorage.getItem(key) || '[]').filter(x => x.id !== id);
            localStorage.setItem(key, JSON.stringify(h));
            type === 'w' ? renderWeightList() : renderPriceList();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>7系条码与会员码综合助手（精准防闪版）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <!-- 引入条码与二维码生成库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --primary: #4e8752;     
            --secondary: #d4a373;   
            --card-bg: rgba(30, 51, 36, 0.85);     
            --card-border: rgba(255, 255, 255, 0.18); 
            --text-main: #e9edc9;   
            --text-sub: #b7b7a4;    
        }

        #fixed-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #0f1d13 0%, #1b3322 40%, #284b30 80%, #132217 100%);
            background-size: cover;
            background-position: center;
            z-index: -999;
            pointer-events: none;
        }

        #fixed-bg::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.15;
            background-image: radial-gradient(#a3b18a 1px, transparent 1px), radial-gradient(#588157 1px, #0f1d13 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            pointer-events: none;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 0;
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
        }
        
        .top-bar {
            position: fixed;
            top: 10px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }
        .top-bar > * {
            pointer-events: auto;
        }

        .version-tag { 
            background: rgba(23, 43, 30, 0.85); 
            color: #d8f3dc; 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 500; 
            border: 1px solid var(--card-border);
            backdrop-filter: blur(8px);
        }

        .bg-btn {
            background: rgba(23, 43, 30, 0.85);
            color: #d8f3dc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(8px);
            cursor: pointer;
        }

        /* 顶部联动标签 */
        .tab-container { 
            position: fixed;
            top: 50px;
            display: flex; 
            width: calc(100% - 30px); 
            max-width: 400px; 
            background: rgba(19, 34, 23, 0.9); 
            border-radius: 14px; 
            padding: 3px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .tab-btn { 
            flex: 1; 
            padding: 8px 4px; 
            border: none; 
            border-radius: 11px; 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            color: var(--text-sub); 
            background: transparent; 
            transition: all 0.25s ease;
            text-align: center;
        }
        .tab-active-weight { background: #4e8752 !important; color: #fff !important; }
        .tab-active-price { background: #d4a373 !important; color: #1e3324 !important; }
        .tab-active-member { background: #3a5a40 !important; color: #e9edc9 !important; border: 1px solid #588157; }

        /* 横向滑动容器 */
        .page-slider {
            display: flex;
            width: 100vw;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .page-slider::-webkit-scrollbar { display: none; }

        /* 每一页独立容器 */
        .page-pane {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            flex-shrink: 0;
            box-sizing: border-box;
            padding: 105px 15px 120px 15px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 22px; 
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            width: 100%; 
            max-width: 380px;
            box-sizing: border-box; 
            flex-shrink: 0;
        }

        .input-group { margin-bottom: 12px; text-align: left; }
        label { font-size: 12px; font-weight: 600; color: #b7b7a4; display: block; margin-bottom: 4px; }
        
        input, textarea { 
            width: 100%; 
            padding: 11px 12px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 16px; 
            outline: none; 
            background: rgba(19, 34, 23, 0.8);
            color: #fff;
            font-family: inherit;
        }
        textarea { resize: none; height: 80px; }
        input:focus, textarea:focus { border-color: #588157; background: rgba(24, 43, 30, 0.95); }
        
        .highlight-fill { background-color: rgba(56, 44, 31, 0.9) !important; border-color: #d4a373 !important; }

        button.btn-weight { width: 100%; padding: 12px; background: linear-gradient(135deg, #4e8752, #386641); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; }
        button.btn-price { width: 100%; padding: 12px; background: linear-gradient(135deg, #d4a373, #bc6c25); color: #1e3324; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; }
        button.btn-member { width: 100%; padding: 12px; background: linear-gradient(135deg, #588157, #3a5a40); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; }
        button.btn-clear { width: 100%; padding: 9px; background: rgba(180, 50, 50, 0.6); color: #ffcccc; border: 1px solid rgba(255,100,100,0.3); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 6px; }
        
        .history-list { width: 100%; max-width: 380px; margin-top: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .item { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 22px; 
            margin-bottom: 20px; 
            position: relative; 
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%; 
            box-sizing: border-box; 
            text-align: center; 
            transform: translateZ(0); /* 开启硬件加速，彻底防止重绘闪烁 */
            -webkit-tap-highlight-color: transparent; 
        }
        
        .item-info { text-align: left; border-bottom: 1px dashed rgba(255,255,255,0.15); margin-bottom: 12px; padding-bottom: 10px; padding-right: 25px; display: flex; flex-direction: column; gap: 4px; }
        
        .item-note { font-weight: 700; color: #e9edc9; font-size: 17px; }
        .item-sub { font-size: 13px; color: #b7b7a4; margin-top: 4px; font-weight: 500; }
        .item-sub b { color: #d4a373; }
        .item-code { font-family: monospace; color: #ccd5ae; font-size: 18px; font-weight: 700; margin-top: 8px; display: block; letter-spacing: 1.5px; } 

        .serial-badge { display: inline-block; background: #588157; color: white; padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: bold; margin-right: 5px; vertical-align: middle; }
        .item-phone { color: #d4a373; font-family: monospace; font-size: 16px; font-weight: bold; margin-top: 2px; }
        
        /* 专属计数触发条：只有点这个才会+1，视觉独立不影响二维码 */
        .scan-progress { 
            font-size: 12px; 
            color: #1e3324; 
            background: #ffb703;
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: bold; 
            margin-top: 8px; 
            cursor: pointer;
            display: inline-block;
            transition: background 0.2s;
        }
        .scan-progress:active { background: #e09f03; }

        .discount-box { 
            display: flex; align-items: center; justify-content: center; gap: 8px; 
            margin-bottom: 12px; font-size: 13px; color: #b7b7a4; 
            background: rgba(19, 34, 23, 0.6); padding: 6px 10px; border-radius: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .discount-box input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #d4a373; }
        .discount-box input[type="number"] { width: 50px; padding: 3px; text-align: center; font-size: 13px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; background: rgba(30, 51, 36, 0.8); color: #fff; }

        .btn-del { 
            position: absolute; right: 12px; top: 12px; color: #ffcccc; border: none; 
            background: rgba(180, 50, 50, 0.6); border-radius: 50%; width: 28px; height: 28px; 
            font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; 
            z-index: 2;
        }

        canvas { width: 100% !important; height: auto; margin-top: 8px; background: #ffffff; border-radius: 10px; padding: 6px 0; }
        .qr-box { display: flex; justify-content: center; margin-top: 8px; }
        .qr-box img, .qr-box canvas { padding: 5px; background: #fff; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); display: block; }
    </style>
</head>
<body>

    <div id="fixed-bg"></div>

    <div class="top-bar">
        <div class="version-tag">🌲 助手 v4.9 (精准防闪版)</div>
        <button class="bg-btn" onclick="document.getElementById('bg-file').click()">🖼️ 更换壁纸</button>
        <input type="file" id="bg-file" accept="image/*" style="display:none" onchange="changeBg(this)">
    </div>

    <!-- 顶部联动标签 -->
    <div class="tab-container">
        <button id="tab-weight" class="tab-btn tab-active-weight" onclick="scrollToPage(0)">按重量生成</button>
        <button id="tab-price" class="tab-btn" onclick="scrollToPage(1)">价格反推</button>
        <button id="tab-member" class="tab-btn" onclick="scrollToPage(2)">会员码生成</button>
    </div>

    <!-- 左右滑动翻页视口 -->
    <div class="page-slider" id="pageSlider" onscroll="handleScrollSync()">
        
        <!-- 第 1 页：按重量生成 -->
        <div class="page-pane">
            <div class="card">
                <h2 style="margin:0 0 12px 0; color:#ccd5ae; font-size:17px; text-align: center; font-weight:700;">录入重量生成条码</h2>
                <div class="input-group">
                    <label>货号</label>
                    <input type="tel" id="w-sku" placeholder="如: 16">
                </div>
                <div class="input-group">
                    <label>重量 (kg)</label>
                    <input type="number" id="w-weight" step="0.001" placeholder="如: 0.525">
                </div>
                <div class="input-group">
                    <label>备注</label>
                    <input type="text" id="w-note" placeholder="如: 鸡蛋">
                </div>
                <button class="btn-weight" onclick="saveWeightCode()">生成并保存条码</button>
            </div>
            <div id="list-weight" class="history-list"></div>
        </div>

        <!-- 第 2 页：价格反推 -->
        <div class="page-pane">
            <div class="card">
                <h2 style="margin:0 0 12px 0; color:#d4a373; font-size:17px; text-align: center; font-weight:700;">输入价格反推重量</h2>
                <div class="input-group">
                    <label>货号 (自动填单价)</label>
                    <input type="tel" id="p-sku" placeholder="输入货号">
                </div>
                <div style="display:flex; gap:8px;">
                    <div class="input-group" style="flex:1;">
                        <label>单价 (元/kg)</label>
                        <input type="number" id="p-unit" step="0.01" placeholder="单价">
                    </div>
                    <div class="input-group" style="flex:1;">
                        <label>总价 (元)</label>
                        <input type="number" id="p-total" step="0.01" placeholder="总额">
                    </div>
                </div>
                <div class="input-group">
                    <label>备注</label>
                    <input type="text" id="p-note" placeholder="备注">
                </div>
                <button class="btn-price" onclick="savePriceCode()">换算并生成条码</button>
            </div>
            <div id="list-price" class="history-list"></div>
        </div>

        <!-- 第 3 页：会员码生成 (精准防闪版) -->
        <div class="page-pane">
            <div class="card">
                <h2 style="margin:0 0 12px 0; color:#e9edc9; font-size:17px; text-align: center; font-weight:700;">会员二维码生成 (自动消减版)</h2>
                <div class="input-group">
                    <label>会员号 / 手机号 (支持批量换行)</label>
                    <textarea id="m-phone" placeholder="输入会员手机号，多个号码请换行&#10;13800000001"></textarea>
                </div>
                <div class="input-group">
                    <label>统一备注 (选填)</label>
                    <input type="text" id="m-note" placeholder="如：VIP批次">
                </div>
                <button class="btn-member" onclick="saveMemberCode()">批量生成会员码</button>
                <button class="btn-clear" onclick="clearAllMembers()">清空所有会员记录</button>
            </div>
            <div id="list-member" class="history-list"></div>
        </div>

    </div>

    <script>
        let scrollTimeout = null;

        window.onload = function() {
            let savedBg = localStorage.getItem('custom_bg_img_snap_v3');
            if (savedBg) {
                document.getElementById('fixed-bg').style.backgroundImage = `url(${savedBg})`;
            }

            renderWeightList();
            renderPriceList();
            initMemberList(); 
            
            document.getElementById('p-sku').addEventListener('input', function() {
                let sku = this.value.padStart(6, '0');
                let map = JSON.parse(localStorage.getItem('sku_price_map_v7') || '{}');
                let unitInput = document.getElementById('p-unit');
                if (map[sku]) {
                    unitInput.value = map[sku];
                    unitInput.classList.add('highlight-fill');
                    setTimeout(() => unitInput.classList.remove('highlight-fill'), 600);
                }
            });
        };

        function changeBg(input) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let base64Img = e.target.result;
                    document.getElementById('fixed-bg').style.backgroundImage = `url(${base64Img})`;
                    localStorage.setItem('custom_bg_img_snap_v3', base64Img);
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function scrollToPage(index) {
            const slider = document.getElementById('pageSlider');
            slider.scrollTo({
                left: slider.clientWidth * index,
                behavior: 'smooth'
            });
        }

        function handleScrollSync() {
            const slider = document.getElementById('pageSlider');
            let index = Math.round(slider.scrollLeft / slider.clientWidth);
            
            const tw = document.getElementById('tab-weight');
            const tp = document.getElementById('tab-price');
            const tm = document.getElementById('tab-member');

            tw.className = 'tab-btn'; 
            tp.className = 'tab-btn'; 
            tm.className = 'tab-btn';

            if (index === 0) tw.className = 'tab-btn tab-active-weight';
            else if (index === 1) tp.className = 'tab-btn tab-active-price';
            else if (index === 2) tm.className = 'tab-btn tab-active-member';

            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                let targetLeft = index * slider.clientWidth;
                if (Math.abs(slider.scrollLeft - targetLeft) > 2) {
                    slider.scrollTo({
                        left: targetLeft,
                        behavior: 'smooth'
                    });
                }
            }, 150);
        }

        // --- 逻辑1: 重量条码 ---
        function calculateEAN13(first12) {
            let sO = 0, sE = 0;
            for (let i = 0; i < 12; i++) {
                let n = parseInt(first12[i]);
                if ((i + 1) % 2 === 0) sE += n; else sO += n;
            }
            let ck = (10 - ((sO + sE * 3) % 10)) % 10;
            return first12 + ck;
        }

        function getComputedGrams(item, currentDiscount, isEnabled) {
            let baseGrams = item.baseGrams;
            if (isEnabled && currentDiscount > 0 && currentDiscount <= 10) {
                return Math.round((baseGrams * 10) / currentDiscount);
            }
            return baseGrams;
        }

        function saveWeightCode() {
            let s = document.getElementById('w-sku').value;
            let w = parseFloat(document.getElementById('w-weight').value);
            let n = document.getElementById('w-note').value || "未命名";
            if (!s || isNaN(w)) return alert("请输入货号和重量");
            
            let baseGrams = Math.round(w * 1000);
            let h = JSON.parse(localStorage.getItem('l_w_v7') || '[]');
            h.unshift({ id: Date.now(), sku: s.padStart(6, '0'), baseGrams: baseGrams, originalWeightStr: w, note: n, discountEnabled: false, discountVal: 5.0 });
            localStorage.setItem('l_w_v7', JSON.stringify(h));
            document.getElementById('w-weight').value = "";
            renderWeightList();
        }

        function renderWeightList() {
            let h = JSON.parse(localStorage.getItem('l_w_v7') || '[]');
            let l = document.getElementById('list-weight');
            l.innerHTML = h.map(i => {
                let curGrams = getComputedGrams(i, i.discountVal, i.discountEnabled);
                let displayWeightKg = (curGrams / 1000).toFixed(3);
                let code = calculateEAN13("7" + i.sku + curGrams.toString().padStart(5, '0'));
                
                return `
                <div class="item">
                    <button class="btn-del" onclick="del('l_w_v7',${i.id},'w')">×</button>
                    <div class="discount-box">
                        <label style="margin:0; cursor:pointer;"><input type="checkbox" ${i.discountEnabled ? 'checked' : ''} onchange="toggleDiscount('l_w_v7', ${i.id}, this.checked)"> 开启折扣</label>
                        <span>折扣:</span>
                        <input type="number" step="0.1" min="1" max="9.9" value="${i.discountVal}" onchange="updateDiscountVal('l_w_v7', ${i.id}, this.value)">折
                    </div>
                    <div class="item-info">
                        <div class="item-note">${i.note}</div>
                        <div class="item-sub">原始重量: ${i.originalWeightStr} kg ${i.discountEnabled ? `<br>✨ 折后计费重: <b>${displayWeightKg} kg</b>` : ''}</div>
                        <span class="item-code">${code}</span>
                    </div>
                    <canvas id="cw-${i.id}"></canvas>
                </div>`;
            }).join('');
            
            h.forEach(i => {
                try {
                    let curGrams = getComputedGrams(i, i.discountVal, i.discountEnabled);
                    let code = calculateEAN13("7" + i.sku + curGrams.toString().padStart(5, '0'));
                    JsBarcode(`#cw-${i.id}`, code, {format:"EAN13", width:2.2, height:60, displayValue:false});
                } catch(e) {}
            });
        }

        function toggleDiscount(key, id, isChecked) {
            let h = JSON.parse(localStorage.getItem(key) || '[]');
            let item = h.find(x => x.id === id);
            if (item) { item.discountEnabled = isChecked; localStorage.setItem(key, JSON.stringify(h)); renderWeightList(); }
        }

        function updateDiscountVal(key, id, val) {
            let num = parseFloat(val);
            if (isNaN(num) || num <= 0 || num >= 10) return;
            let h = JSON.parse(localStorage.getItem(key) || '[]');
            let item = h.find(x => x.id === id);
            if (item) { item.discountVal = num; localStorage.setItem(key, JSON.stringify(h)); renderWeightList(); }
        }

        // --- 逻辑2: 价格反推 ---
        function savePriceCode() {
            let s = document.getElementById('p-sku').value;
            let u = parseFloat(document.getElementById('p-unit').value);
            let t = parseFloat(document.getElementById('p-total').value);
            let n = document.getElementById('p-note').value || "未命名";
            if (!s || isNaN(u) || isNaN(t)) return alert("请完整输入信息");
            
            let baseGrams = Math.round((t / u) * 1000);
            if (baseGrams > 99999) return alert("重量超出限制");
            
            let sku = s.padStart(6, '0');
            let map = JSON.parse(localStorage.getItem('sku_price_map_v7') || '{}');
            map[sku] = u;
            localStorage.setItem('sku_price_map_v7', JSON.stringify(map));

            let h = JSON.parse(localStorage.getItem('l_p_v7') || '[]');
            h.unshift({ id: Date.now(), sku: sku, baseGrams: baseGrams, totalPrice: t, unitPrice: u, note: n, discountEnabled: false, discountVal: 5.0 });
            localStorage.setItem('l_p_v7', JSON.stringify(h));
            document.getElementById('p-total').value = "";
            renderPriceList();
        }

        function renderPriceList() {
            let h = JSON.parse(localStorage.getItem('l_p_v7') || '[]');
            let l = document.getElementById('list-price');
            l.innerHTML = h.map(i => {
                let curGrams = getComputedGrams(i, i.discountVal, i.discountEnabled);
                let displayWeightKg = (curGrams / 1000).toFixed(3);
                let code = calculateEAN13("7" + i.sku + curGrams.toString().padStart(5, '0'));
                
                return `
                <div class="item">
                    <button class="btn-del" onclick="del('l_p_v7',${i.id},'p')">×</button>
                    <div class="discount-box">
                        <label style="margin:0; cursor:pointer;"><input type="checkbox" ${i.discountEnabled ? 'checked' : ''} onchange="togglePriceDiscount(${i.id}, this.checked)"> 开启折扣</label>
                        <span>折扣:</span>
                        <input type="number" step="0.1" min="1" max="9.9" value="${i.discountVal}" onchange="updatePriceDiscountVal(${i.id}, this.value)">折
                    </div>
                    <div class="item-info">
                        <div class="item-note">${i.note}</div>
                        <div class="item-sub">目标总价: ${i.totalPrice}元 ${i.discountEnabled ? `<br>✨ 折后结算重: <b>${displayWeightKg}kg</b>` : `(约 ${(i.baseGrams/1000).toFixed(3)}kg)`}</div>
                        <span class="item-code">${code}</span>
                    </div>
                    <canvas id="cp-${i.id}"></canvas>
                </div>`;
            }).join('');
            
            h.forEach(i => {
                try {
                    let curGrams = getComputedGrams(i, i.discountVal, i.discountEnabled);
                    let code = calculateEAN13("7" + i.sku + curGrams.toString().padStart(5, '0'));

        function saveMemberCode() {
            let phoneText = document.getElementById('m-phone').value;
            let note = document.getElementById('m-note').value || "未备注";
            if (!phoneText.trim()) return alert("请输入至少一个会员号");

            let phoneArray = phoneText.split('\n').map(p => p.trim()).filter(p => p !== "");
            let history = JSON.parse(localStorage.getItem('my_qr_list_v7_exact') || '[]');
            let maxSerial = history.reduce((max, item) => Math.max(max, item.serial || 0), 0);

            let newItems = [];
            phoneArray.forEach((phone, index) => {
                maxSerial++;
                newItems.push({ id: Date.now() + index, serial: maxSerial, content: phone, note: note, scanCount: 0 });
            });

            history = newItems.concat(history);
            localStorage.setItem('my_qr_list_v7_exact', JSON.stringify(history));
            document.getElementById('m-phone').value = "";
            document.getElementById('m-note').value = "";
            initMemberList(); 
        }

        // 只有点击下方的黄条时才触发+1和局部更新，完全不影响二维码区域
        function handleScanClick(id, event) {
            event.stopPropagation(); // 阻止事件冒泡

            let history = JSON.parse(localStorage.getItem('my_qr_list_v7_exact') || '[]');
            let itemIndex = history.findIndex(x => x.id === id);
            if (itemIndex !== -1) {
                let item = history[itemIndex];
                item.scanCount = (item.scanCount || 0) + 1;

                if (item.scanCount >= 5) {
                    history.splice(itemIndex, 1);
                    localStorage.setItem('my_qr_list_v7_exact', JSON.stringify(history));
                    let cardEl = document.getElementById('member-card-' + id);
                    if (cardEl) {
                        cardEl.style.transition = "all 0.3s ease";
                        cardEl.style.transform = "scale(0.9)";
                        cardEl.style.opacity = "0";
                        setTimeout(() => cardEl.remove(), 300);
                    }
                } else {
                    localStorage.setItem('my_qr_list_v7_exact', JSON.stringify(history));
                    let progressEl = document.getElementById('scan-text-' + id);
                    if (progressEl) {
                        progressEl.innerText = `🔄 已扫次数: ${item.scanCount} / 5 （点此+1）`;
                    }
                }
            }
        }

        function deleteMember(id) {
            let history = JSON.parse(localStorage.getItem('my_qr_list_v7_exact') || '[]');
            history = history.filter(item => item.id !== id);
            localStorage.setItem('my_qr_list_v7_exact', JSON.stringify(history));
            let cardEl = document.getElementById('member-card-' + id);
            if (cardEl) cardEl.remove();
        }
